issue_tracker: https://github.com/SoundSliced/s_time/issues
repository: https://github.com/SoundSliced/s_time
version: 3.0.0
homepage: https://github.com/SoundSliced/s_time

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies: 
  flutter:
    sdk: flutter
  s_packages: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

